name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Core deps + dev tools (ruff, mypy, pytest) + the ingest extra so mypy
      # type-checks against the real docling/tiktoken API. The test suite is
      # fully hermetic — no API keys, no network — so nothing else is needed.
      - name: Install
        run: uv sync --extra dev --extra ingest

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format (ruff)
        run: uv run ruff format --check src tests

      - name: Types (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest -q
