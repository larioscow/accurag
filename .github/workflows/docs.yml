name: docs

on:
  push:
    branches: [main, master]
    paths:
      - docs/**
      - mkdocs.yml
      - src/**
      - pyproject.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra docs
      # --strict fails the build on a broken link or a missing nav/reference,
      # so this doubles as a docs check on every push.
      - run: uv run mkdocs build --strict
